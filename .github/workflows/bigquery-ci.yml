name: BigQuery CI

on:
  pull_request:
    paths:
      - "bq/**"
      - ".github/workflows/bigquery-ci.yml"
  push:
    branches: [main]
    paths:
      - "bq/**"
      - ".github/workflows/bigquery-ci.yml"

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  BQ_DATASET: ${{ vars.BQ_DATASET }}
  BQ_LOCATION: US

jobs:
  validate:
    name: Validate SQL (dry-run)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Build the full chain into an ephemeral, PR-scoped dataset so dependent
      # objects (model + views that reference earlier tables) validate for real.
      - name: Validate in ephemeral dataset
        env:
          PROJECT: ${{ env.GCP_PROJECT_ID }}
          DATASET: ci_pr_${{ github.run_id }}
          LOCATION: ${{ env.BQ_LOCATION }}
        run: bash bq/deploy.sh

      - name: Cleanup ephemeral dataset
        if: always()
        run: |
          bq --project_id="${GCP_PROJECT_ID}" rm -r -f -d \
            "${GCP_PROJECT_ID}:ci_pr_${{ github.run_id }}" || true

  deploy:
    name: Deploy to BigQuery
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy core artifacts
        env:
          PROJECT: ${{ env.GCP_PROJECT_ID }}
          DATASET: ${{ env.BQ_DATASET }}
          LOCATION: ${{ env.BQ_LOCATION }}
        run: bash bq/deploy.sh

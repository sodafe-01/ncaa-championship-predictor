version: 2

models:
  - name: f_team_season
    description: >
      Report card: one row per season × scope × D1 team.
      Scopes are pre_ncaa (closed games with a result before that season's
      first NCAA tournament game) and full (every closed game with a result).
      Grain and names are frozen in DE-02. Efficiency, returning-roster and
      ranks are filled by DE-06 and DE-07.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, scope, team_id]
      - row_count_between:
          arguments:
            min_count: 351
            max_count: 351
            group_by: [season, scope]
      - expression_is_true:
          arguments:
            expression: "wins + losses = games"
    columns:
      - name: season
        description: Season start year (2017 = 2017-18).
        data_tests: [not_null]
      - name: season_label
        description: Academic label, e.g. 2017-18.
      - name: scope
        description: pre_ncaa for tournament prediction inputs; full for a finished season.
        data_tests:
          - accepted_values:
              arguments:
                values: ['pre_ncaa', 'full']
      - name: team_id
        description: Sportradar team id.
        data_tests: [not_null]
      - name: market
        description: School name, e.g. Villanova.
      - name: alias
        description: Short team code, e.g. VILL.
      - name: conf_alias
        description: >
          Most common per-game conf_alias for the team in this season and
          scope. Best available source signal, not audited historical membership.
      - name: games
        description: Closed games with a result (win IS NOT NULL) in scope, any opponent.
      - name: wins
        description: Closed wins in scope.
      - name: losses
        description: Closed non-wins in scope (games − wins).
      - name: win_pct
        description: wins / games.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: d1_games
        description: Valid D1-vs-D1 games used for efficiency (DE-07).
      - name: tempo
        description: Possessions per game (DE-07).
      - name: raw_oe
        description: Points scored per 100 possessions (DE-07).
      - name: raw_de
        description: Points allowed per 100 possessions (DE-07).
      - name: raw_net
        description: raw_oe − raw_de (DE-07).
      - name: adj_oe
        description: raw_oe adjusted for opponent defense and venue (DE-07).
      - name: adj_de
        description: raw_de adjusted for opponent offense and venue (DE-07).
      - name: adj_net
        description: adj_oe − adj_de; main strength rating (DE-07).
      - name: sos_adj_net
        description: Average opponent adj_net (DE-07).
      - name: conference_strength
        description: >
          Mean adj_net for all teams with the same season, scope and
          conf_alias (DE-07).
      - name: efg_pct
        description: (FGM + 0.5 × 3PM) / FGA (DE-07).
      - name: tov_pct
        description: Turnovers per possession (DE-07).
      - name: orb_pct
        description: ORB / (ORB + opponent DRB) (DE-07).
      - name: ftr
        description: FTA / FGA (DE-07).
      - name: opp_efg_pct
        description: Opponents' efg_pct (DE-07).
      - name: opp_tov_pct
        description: Opponents' turnovers per possession (DE-07).
      - name: drb_pct
        description: DRB / (DRB + opponent ORB) (DE-07).
      - name: opp_ftr
        description: Opponents' FTA / FGA (DE-07).
      - name: three_par
        description: 3PA / FGA (DE-07).
      - name: three_pct
        description: 3PM / 3PA (DE-07).
      - name: ft_pct
        description: FTM / FTA (DE-07).
      - name: last10_net
        description: Raw net efficiency over the last 10 D1 games in scope (DE-07).
      - name: ap_rank_last
        description: AP rank at the team's last game in scope; NULL = unranked (DE-07).
      - name: experience_index
        description: Minutes-weighted class (FR=1 … GR=5); 2017-18 only (DE-07).
      - name: ret_min_share
        description: Share of minutes expected back next season (DE-06 → DE-07).
      - name: ret_pts_share
        description: Share of points expected back next season (DE-06 → DE-07).
      - name: ret_basis
        description: actual (2014-15 to 2016-17) or class_proxy (2017-18) (DE-06 → DE-07).
      - name: program_win_pct_5y
        description: Win percent over the previous five seasons (DE-07).
      - name: rank_adj_net
        description: 1 = best adj_net in season × scope (DE-07).
      - name: pctl_adj_oe
        description: 0–1, 1 = best offense (DE-07).
      - name: pctl_adj_de
        description: 0–1, 1 = best defense / lowest adj_de (DE-07).
      - name: pctl_adj_net
        description: 0–1, 1 = best net (DE-07).
      - name: pctl_tempo
        description: 0–1, 1 = fastest (DE-07).
      - name: pctl_efg_pct
        description: 0–1, 1 = best eFG% (DE-07).
      - name: pctl_tov_pct
        description: 0–1, 1 = fewest turnovers (DE-07).
      - name: pctl_orb_pct
        description: 0–1, 1 = best ORB% (DE-07).
      - name: pctl_ftr
        description: 0–1, 1 = most free-throw attempts (DE-07).
      - name: pctl_three_par
        description: 0–1, 1 = most three-point heavy (DE-07).
      - name: pctl_opp_efg_pct
        description: 0–1, 1 = best defense (lowest opponent eFG) (DE-07).

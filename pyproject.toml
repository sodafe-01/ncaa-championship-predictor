[project]
name = "ncaa-championship-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "dbt-core==1.11.7",
  "dbt-bigquery==1.11.1",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
